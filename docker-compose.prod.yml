# DocuPilot - production stack.
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Frontend (:3000, Next.js standalone) and FastAPI backend (:8000) run as
# separate services. The backend applies migrations on startup.

name: docupilot

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docupilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-docupilot}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docupilot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model ${LLM_MODEL:-Qwen/Qwen3-14B-AWQ}
      --quantization awq
      --max-model-len ${LLM_CONTEXT_WINDOW:-32768}
      --gpu-memory-utilization 0.92
      --port 8001
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
      HF_HUB_ENABLE_HF_TRANSFER: "1"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docupilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docupilot}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      VLLM_BASE_URL: http://vllm:8001/v1
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen3-14B-AWQ}
      STORAGE_PATH: /data/storage
      EMBEDDING_USE_FP16: "false"
      HF_HOME: /models
      ENVIRONMENT: production
      DEBUG: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - storage:/data/storage
      - hf_cache:/models
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4g

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=1
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docupilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docupilot}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_PATH: /data/storage
      EMBEDDING_USE_FP16: "false"
      HF_HOME: /models
    volumes:
      - storage:/data/storage
      - hf_cache:/models
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6g

  beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docupilot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docupilot}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      STORAGE_PATH: /data/storage
      HF_HOME: /models
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  pg_data:
  hf_cache:
  storage:
