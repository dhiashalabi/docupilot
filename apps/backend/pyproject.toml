[project]
name = "docupilot-backend"
version = "0.1.0"
description = "DocuPilot backend: multilingual, self-hosted RAG PDF chat API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "docling>=2.102.2",
    "fastapi[standard]>=0.137.1",
    "flagembedding>=1.4.0",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "markdown-it-py>=4.2.0",
    "openai>=2.42.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.0.0",
    "sentence-transformers>=5.6.0,<6",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.49.0",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
